name: MacOS

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '**/CMakeLists.txt'
      - '**.cpp'
      - '**.h'
      - 'tests/**'
      - 'external/**'

jobs:
  build-macos:
    name: Build and run tests
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install nanobind
      run: python -m pip install --upgrade pip "nanobind>=2.12.0"

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release\
          -DTWEEDLEDUM_TESTS=ON \
          -DTWEEDLEDUM_PYBINDS=ON

    - name: Build tests
      working-directory: build
      run: make -j2 run_tests

    - name: Build python lib
      working-directory: build
      run: make -j2 _tweedledum

    - name: Run tests
      working-directory: build
      run: |
        ./tests/run_tests
